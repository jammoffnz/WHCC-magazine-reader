name: Deploy Website to InfinityFree

on:
  push:
    branches:
      - main  # Triggers the deployment every time you push to the main branch

jobs:
  web-deploy:
    name: Deploying via FTP
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Sync files to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./                  # The folder in your repo to upload
        server-dir: ./htdocs/          # InfinityFree requires files inside the htdocs folder
